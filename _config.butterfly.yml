# --------------------------------------
# Hexo Butterfly 主题配置
# 如有疑问，请查阅以下文档
# 中文文档：https://butterfly.js.org/
# 英文文档：https://butterfly.js.org/en/
# --------------------------------------

# --------------------------------------
# 导航设置
# --------------------------------------

nav:
  # 导航栏 Logo 图片
  logo:
  display_title: true
  display_post_title: true
  # 是否固定导航栏
  fixed: false

menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  # 列表||fas fa-list:
  #   音乐: /music/ || fas fa-music
  #   电影: /movies/ || fas fa-video

# --------------------------------------
# 代码块设置
# --------------------------------------

code_blocks:
  # 代码块主题：darker / pale night / light / ocean / false
  theme: light
  macStyle: false
  # 代码块高度限制（单位：px）
  height_limit: false
  word_wrap: false

  # 工具栏
  copy: true
  language: true
  # true：折叠代码块 | false：展开代码块 | none：展开代码块并隐藏按钮
  shrink: false
  fullpage: false

# 社交媒体链接
# 格式：
#   图标: 链接 || 描述 || 颜色
social:
    fab fa-github: https://github.com/f-jayson || Github
  # fas fa-envelope: mailto:xxxxxx@gmail.com || 邮箱 || '#4a7dbe'

# --------------------------------------
# 图片设置
# --------------------------------------

favicon: /img/favicon.jpg

avatar:
  img: /img/avatar.jpg
  effect: false

# 是否禁用所有横幅图片
disable_top_img: false

# 页面未设置横幅图片时，将显示 default_top_img
default_top_img: /img/background.webp

# 首页横幅图片
index_img: /img/background.webp

# 归档页横幅图片
archive_img:

# 注意：这里指单个标签页面，而不是标签列表页面
tag_img:

# 标签页横幅图片，可以为每个标签单独设置
# 格式：
#  - 标签名称: xxxxx
tag_per_img:

# 注意：这里指单个分类页面，而不是分类列表页面
category_img:

# 分类页横幅图片，可以为每个分类单独设置
# 格式：
#  - 分类名称: xxxxx
category_per_img:

# 页脚背景图片
footer_img: false

# 网站背景
# 可设置为颜色、图片 URL，或由颜色和图片 URL 组成的数组
# 如果提供数组，每次加载时会从中随机选择一个背景
background:

cover:
  # 是否禁用封面
  index_enable: true
  aside_enable: true
  archives_enable: true
  # 未设置封面时显示默认封面
  default_cover:
    # - xxx.jpg

# 替换加载失败的图片
error_img:
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

# 简单的 404 页面
error_404:
  enable: true
  subtitle: '页面不存在'
  background: /img/error-page.png

post_meta:
  # 首页
  page:
    # 可选值：created / updated / both
    date_type: created
    # 可选值：date / relative
    date_format: date
    categories: true
    tags: false
    label: true
  post:
    # 可选值：left / center
    position: left
    # 可选值：created / updated / both
    date_type: both
    # 可选值：date / relative
    date_format: date
    categories: true
    tags: true
    label: true

# --------------------------------------
# 首页设置
# --------------------------------------

# 首页 top_img 设置
# 默认：顶部图片全屏显示，站点信息居中
# 站点信息的位置，例如：300px/300em/300rem/10%
index_site_info_top:
# top_img 的高度，例如：300px/300em/300rem
index_top_img_height:

# 首页副标题
subtitle:
  enable: false
  # 打字机效果
  effect: true
  # 自定义 typed.js
  # https://github.com/mattboldt/typed.js/#customization
  typed_option:
  # 内容来源：调用第三方服务 API（仅支持中文）
  # 会先显示来源，再显示 sub 中的内容
  # 可选值：false/1/2/3
  # false：禁用此功能
  # 1 - hitokoto.cn
  # 2 - https://api.aa1.cn/doc/yiyan.html
  # 3 - jinrishici.com
  source: false
  # 关闭打字机效果后，副标题只显示 sub 的第一行
  sub:

# 首页文章布局
# 1：封面在左，信息在右
# 2：封面在右，信息在左
# 3：封面和信息左右交替
# 4：封面在上，信息在下
# 5：信息显示在封面上
# 6：瀑布流布局，封面在上、信息在下
# 7：瀑布流布局，信息显示在封面上
index_layout: 3

# 在首页显示文章简介
# 1：description
# 2：both（存在 description 时显示 description，否则显示 auto_excerpt）
# 3：auto_excerpt（默认）
# false：不显示文章简介
index_post_content:
  method: 3
  # method 设为 2 或 3 时，需要配置摘要长度
  length: 500

# --------------------------------------
# 文章设置
# --------------------------------------

toc:
  post: true
  page: false
  number: true
  expand: false
  # 仅用于文章页面
  style_simple: false
  scroll_percent: true

post_copyright:
  enable: true
  decode: false
  author_href:
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 赞助/打赏
reward:
  enable: false
  text:
  QR_code:
    # - img: /img/wechat.jpg
    #   link:
    #   text: wechat
    # - img: /img/alipay.jpg
    #   link:
    #   text: alipay

# 在线编辑文章
# 方便地在线浏览并编辑博客源代码
post_edit:
  enable: true
  # url: https://github.com/user-name/repo-name/edit/branch-name/subdirectory-name/
  # 示例：https://github.com/jerryc127/butterfly.js.org/edit/main/source/
  url: https://github.com/F-Jayson/blog/edit/main/source/

# 相关文章
related_post:
  enable: true
  # 显示的文章数量
  limit: 6
  # 可选值：created / updated
  date_type: created

# 可选值：1 / 2 / false
# 1：“下一篇”链接指向旧文章
# 2：“下一篇”链接指向新文章
# false：禁用文章分页
post_pagination: 1

# 显示文章过期提示
noticeOutdate:
  enable: false
  # 样式：simple / flat
  style: flat
  # 多少天后显示
  limit_day: 365
  # 位置：top / bottom
  position: top
  message_prev: It has been
  message_next: days since the last update, the content of the article may be outdated.

# --------------------------------------
# 页脚设置
# --------------------------------------
footer:
  nav:
  owner:
    enable: true
    since: 2025
  # 主题和框架的版权信息
  copyright:
    enable: true
    version: true
  custom_text:

# --------------------------------------
# 侧栏设置
# --------------------------------------

aside:
  enable: true
  hide: false
  # 是否在右下角显示隐藏侧栏按钮
  button: true
  mobile: true
  # 位置：left / right
  position: left
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description:
    button:
      enable: true
      icon: fab fa-github
      text: Github
      link: https://github.com/F-Jayson
  card_announcement:
    enable: true
    content: 欢迎来到我的博客。
  card_recent_post:
    enable: true
    # 设为 0 时显示全部
    limit: 5
    # 排序依据：date / updated
    sort: date
    sort_order:
  card_newest_comments:
    enable: true
    sort_order:
    limit: 5
    # 单位：分钟，数据保存到 localStorage
    storage: 10
    avatar: true
  card_categories:
    enable: true
    # 设为 0 时显示全部
    limit: 8
    # 可选值：none / true / false
    expand: none
    sort_order:
  card_tags:
    enable: true
    # 设为 0 时显示全部
    limit: 40
    color: false
    custom_colors:
    # 标签排序依据：random/name/length
    orderby: random
    # 排序方向：1 或 asc 表示升序；-1 或 desc 表示降序
    order: 1
    sort_order:
  card_archives:
    enable: true
    # 类型：monthly / yearly
    type: monthly
    # 示例：YYYY年MM月
    format: MMMM YYYY
    # 排序方向：1 或 asc 表示升序；-1 或 desc 表示降序
    order: -1
    # 设为 0 时显示全部
    limit: 8
    sort_order:
  card_post_series:
    enable: true
    # 标题显示系列名称
    series_title: false
    # 按标题或日期排序
    orderBy: 'date'
    # 排序方向：1 或 asc 表示升序；-1 或 desc 表示降序
    order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true
    sort_order:
    # 发布日期与当前时间的时间差
    # 格式：月/日/年 时间，或 年/月/日 时间
    # 不启用此功能时请留空
    runtime_date:

# --------------------------------------
# 右下角按钮
# --------------------------------------

# 右下角按钮与页面底部的距离（默认单位：px）
rightside_bottom:

# 繁体中文与简体中文转换
translate:
  enable: false
  # 按钮文字
  default: 繁
  # 网站语言（1 表示繁体中文，2 表示简体中文）
  defaultEncoding: 2
  # 延迟时间
  translateDelay: 0
  # 当前语言为简体中文时的按钮文字
  msgToTraditionalChinese: '繁'
  # 当前语言为繁体中文时的按钮文字
  msgToSimplifiedChinese: '簡'

# 阅读模式
readmode: true

# 深色模式
darkmode:
  enable: true
  # 显示切换深色/浅色模式的按钮
  button: true
  # 自动切换深色/浅色模式
  # autoChangeMode: 1 跟随系统设置；如果系统不支持深色模式，则在晚上 6 点到早上 6 点之间使用深色模式
  # autoChangeMode: 2 在晚上 6 点到早上 6 点之间使用深色模式
  # autoChangeMode: false
  autoChangeMode: false
  # 设置浅色模式的时间范围，取值为 0 到 24；未设置时默认为 6 和 18
  start:
  end:

# 在返回顶部按钮中显示滚动百分比
rightside_scroll_percent: false

# 除非了解其工作方式，否则不要修改以下设置
# 可选值：readmode,translate,darkmode,hideAside,toc,chat,comment
# 不要重复填写相同的值
rightside_item_order:
  enable: false
  # 默认值：readmode,translate,darkmode,hideAside
  hide:
  # 默认值：toc,chat,comment
  show:

# 右下角设置按钮的动画
rightside_config_animation: true

# --------------------------------------
# 全局设置
# --------------------------------------

anchor:
  # 滚动时根据标题 ID 更新 URL
  auto_update: false
  # 点击标题时滚动并更新锚点
  click_to_scroll: false

photofigcaption: false

copy:
  enable: true
  # 在复制的内容后添加版权信息
  copyright:
    enable: false
    limit_count: 150

# 需要安装 hexo-wordcount 插件
wordcount:
  enable: true
  # 在文章元数据中显示文章字数
  post_wordcount: true
  # 在文章元数据中显示阅读时长
  min2read: true
  # 在侧栏网站信息中显示全站总字数
  total_wordcount: true

# 使用不蒜子统计站点的 PV / UV
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# --------------------------------------
# 数学公式
# --------------------------------------

# 关于 per_page
# 设为 true 时，每个页面都会加载 MathJax/KaTeX 脚本
# 设为 false 时，将根据页面设置加载 MathJax/KaTeX 脚本（需要在页面 front-matter 中添加 'mathjax: true' 或 'katex: true'）
math:
  # 可选值：mathjax、katex
  # 不需要数学公式时请留空
  use:
  per_page: true
  hide_scrollbar: false

  mathjax:
    # 启用上下文菜单
    enableMenu: true
    # 可选值：all / ams / none，用于控制公式是否编号以及编号方式
    tags: none

  katex:
    # 启用复制 KaTeX 公式功能
    copy_tex: false

# --------------------------------------
# 搜索
# --------------------------------------

search:
  # 可选值：algolia_search / local_search / docsearch
  # 不需要搜索功能时请留空
  use: local_search
  placeholder: 搜索

  # Algolia 搜索
  algolia_search:
    # 每页搜索结果数量
    hitsPerPage: 6

  # 本地搜索
  local_search:
    # 页面加载时预加载搜索数据
    preload: true
    # 每篇文章显示前 n 条结果，设为 -1 时显示全部结果
    top_n_per_article: 3
    # 将转义后的 HTML 字符串还原为可读内容
    unescape: false
    # 启用搜索结果分页
    pagination:
      enable: false
      # 每页搜索结果数量
      hitsPerPage: 8
    CDN:

  # DocSearch 搜索
  # https://docsearch.algolia.com/
  docsearch:
    appId:
    apiKey:
    indexName:
    option:

# --------------------------------------
# 分享系统
# --------------------------------------

share:
  # 可选值：sharejs / addtoany
  # 不需要分享功能时请留空
  use: sharejs

  # Share.js 分享工具
  # https://github.com/overtrue/share.js
  sharejs:
    sites: facebook,x,wechat,weibo,qq

  # AddToAny 分享工具
  # https://www.addtoany.com/
  addtoany:
    item: facebook,x,wechat,sina_weibo,facebook_messenger,email,copy_link

# --------------------------------------
# 评论系统
# --------------------------------------

comments:
  # 最多可配置两个评论系统，第一个将作为默认系统显示
  # 不需要评论功能时请留空
  # 可选值：Disqus/Disqusjs/Livere/Gitalk/Valine/Waline/Utterances/Facebook Comments/Twikoo/Giscus/Remark42/Artalk
  # 配置两个评论系统时的格式：Disqus,Waline
  use: Artalk
  # 在按钮旁显示评论系统名称
  text: true
  # 懒加载：评论元素进入浏览器可视区域时才加载评论系统
  # 设为 true 时，评论数量将无法正常显示
  lazyload: false
  # 在文章 top_img 中显示评论数量
  count: true
  # 在首页显示评论数量
  card_post_count: false

# Disqus 评论系统
# https://disqus.com/
disqus:
  shortname:
  # 用于最新评论组件
  apikey:

# 备用 Disqus 方案：使用 Disqus API 渲染评论
# https://github.com/SukkaW/DisqusJS
disqusjs:
  shortname:
  apikey:
  option:

# Livere 评论系统
# https://www.livere.com/
livere:
  uid:

# Gitalk 评论系统
# https://github.com/gitalk/gitalk
gitalk:
  client_id:
  client_secret:
  repo:
  owner:
  admin:
  option:

# Valine 评论系统
# https://valine.js.org
valine:
  appId:
  appKey:
  avatar: monsterid
  # 此配置适用于国内自定义域名用户，海外版本会自动检测，无需手动填写
  serverURLs:
  bg:
  # 使用 Valine 访问量作为页面浏览量
  visitor: false
  option:

# Waline：从 Valine 分支而来的简洁后端评论系统
# https://waline.js.org/
waline:
  serverURL:
  bg:
  # 使用 Waline 页面浏览量作为本站页面浏览量
  pageview: false
  option:

# Utterances 评论系统
# https://utteranc.es/
utterances:
  repo:
  # Issue 映射方式：pathname/url/title/og:title
  issue_term: pathname
  # 主题：github-light/github-dark/github-dark-orange/icy-dark/dark-blue/photon-dark
  light_theme: github-light
  dark_theme: photon-dark
  js:
  option:

# Facebook 评论插件
# https://developers.facebook.com/docs/plugins/comments/
facebook_comments:
  app_id:
  # 可选
  user_id:
  pageSize: 10
  # 可选值：social / time / reverse_time
  order_by: social
  lang: en_US

# Twikoo 评论系统
# https://github.com/imaegoo/twikoo
twikoo:
  envId:
  region:
  # 使用 Twikoo 访问量作为页面浏览量
  visitor: false
  option:

# Giscus 评论系统
# https://giscus.app/
giscus:
  repo:
  repo_id:
  category_id:
  light_theme: light
  dark_theme: dark
  js:
  option:

# Remark42 评论系统
# https://remark42.com/docs/configuration/frontend/
remark42:
  host:
  siteId:
  option:

# Artalk 评论系统
# https://artalk.js.org/guide/frontend/config.html
artalk:
  server: https://comments.blog-jayson.com
  site: Jayson-Blog
  # 使用 Artalk 访问量作为页面浏览量
  visitor: true
  option:
    locale: zh-CN

# --------------------------------------
# 在线聊天服务
# --------------------------------------

chat:
  # 可选值：chatra/tidio/crisp/knocket
  # 不需要聊天功能时请留空
  use:
  # 聊天按钮（推荐）
  # 在网站右下角创建按钮，并隐藏聊天服务的原始按钮
  rightside_button: false
  # 向上滚动时显示原始聊天按钮，向下滚动时隐藏按钮
  button_hide_show: false

# https://chatra.io/
chatra:
  id:

# https://www.tidio.com/
tidio:
  public_key:

# https://crisp.chat/en/
crisp:
  website_id:

# https://trtc.io/solutions/knocket
knocket:
  identifier:

# --------------------------------------
# 网站分析
# --------------------------------------

# https://tongji.baidu.com/web/welcome/login
baidu_analytics:

# https://analytics.google.com/analytics/web/
google_analytics:

# https://www.cloudflare.com/zh-tw/web-analytics/
cloudflare_analytics:

# https://clarity.microsoft.com/
microsoft_clarity:

# https://umami.is/
umami_analytics:
  enable: false
  # 自托管时，配置 Umami 实例的主机名
  serverURL:
  script_name: script.js
  website_id:
  option:
  UV_PV:
    site_uv: false
    site_pv: false
    page_pv: false
    # Umami Cloud 填写 API key，自托管 Umami 填写 token
    token:

# https://www.googletagmanager.com/
google_tag_manager:
  tag_id:
  # 可选
  domain:

# --------------------------------------
# 广告
# --------------------------------------

# Google AdSense 广告
google_adsense:
  enable: false
  auto_ads: true
  js: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js
  client:
  enable_page_level_ads: true

# 手动插入广告
# 不需要广告时请留空
ad:
  # 在首页插入广告（每三篇文章一次）
  index:
  # 在侧栏插入广告
  aside:
  # 在文章中插入广告（分页之前）
  post:

# --------------------------------------
# 站点验证
# --------------------------------------

site_verification:
  # - name: google-site-verification
  #   content: xxxxxx
  # - name: baidu-site-verification
  #   content: xxxxxxx

# --------------------------------------
# 美化与特效
# --------------------------------------

# 自定义主题颜色
# 注意：颜色值必须使用双引号，例如 "#000"，否则可能导致错误

# theme_color:
#   enable: true
#   main: "#49B1F5"
#   paginator: "#00c4b6"
#   button_hover: "#FF7242"
#   text_selection: "#00c4b6"
#   link_color: "#99a9bf"
#   meta_color: "#858585"
#   hr_color: "#A4D8FA"
#   code_foreground: "#F47466"
#   code_background: "rgba(27, 31, 35, .05)"
#   toc_color: "#00c4b6"
#   blockquote_padding_color: "#49b1f5"
#   blockquote_background_color: "#49b1f5"
#   scrollbar_color: "#49b1f5"
#   meta_theme_color_light: "ffffff"
#   meta_theme_color_dark: "#0d0d0d"

# 分类页和标签页的界面设置
# 可选值：index 表示与首页界面相同；default 表示与归档页界面相同
# 留空或填写 index
category_ui:
tag_ui:

# 为界面元素启用圆角
rounded_corners_ui: true

# 拉伸文本行，使每一行宽度相等
text_align_justify: false

# 为页首和页脚添加遮罩
mask:
  header: true
  footer: true

# 加载动画
preloader:
  enable: false
  # 动画来源
  # 1. fullpage-loading（全屏加载）
  # 2. pace（进度条）
  source: 1
  # pace 主题（参见 https://codebyzach.github.io/pace/）
  pace_css_url:

# 页面过渡动画
enter_transitions: true

# 默认显示模式：light（默认）/ dark
display_mode: light

# 文章内容美化配置
beautify:
  enable: false
  # 指定美化范围（site 或 post）
  field: post
  # 指定标题前缀使用的图标，例如 '\f0c1'
  title_prefix_icon:
  # 指定标题前缀图标的颜色，例如 '#F47466'
  title_prefix_icon_color:

# 全局字体设置
# 除非了解其工作方式，否则不要修改以下设置
font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

# 站点标题和副标题的字体设置
blog_title_font:
  font_link:
  font_family:

# 分隔线图标设置
hr_icon:
  enable: true
  # Font Awesome 图标的 Unicode 值，例如 '\3423'
  icon:
  icon_top:

# 打字机效果
# https://github.com/disjukr/activate-power-mode
activate_power_mode:
  enable: false
  colorful: true
  shake: true
  mobile: false

# 背景特效
# --------------------------------------

# canvas_ribbon 彩带背景特效
# 参见：https://github.com/hustcc/ribbon.js
canvas_ribbon:
  enable: false
  # 彩带大小
  size: 150
  # 彩带透明度（0 到 1）
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false

# 飘动彩带
canvas_fluttering_ribbon:
  enable: false
  mobile: false

# canvas_nest 动态线条背景特效
# https://github.com/hustcc/canvas-nest.js
canvas_nest:
  enable: true
  # 线条颜色，默认值为 '0,0,0'；RGB 值格式为 (R,G,B)，使用逗号分隔
  color: '0,0,255'
  # 线条透明度（0 到 1）
  opacity: 0.7
  # 背景的 z-index 属性
  zIndex: -1
  # 线条数量
  count: 99
  mobile: false

# 鼠标点击特效：烟花
fireworks:
  enable: false
  zIndex: 9999
  mobile: false

# 鼠标点击特效：爱心
click_heart:
  enable: false
  mobile: false

# 鼠标点击特效：文字
clickShowText:
  enable: false
  text:
    # - 我
    # - 爱
    # - 你
  fontSize: 15px
  random: false
  mobile: false

# --------------------------------------
# 图片灯箱设置
# --------------------------------------

# 可选值：fancybox / medium_zoom
# https://github.com/francoischalifour/medium-zoom
# https://fancyapps.com/fancybox/
# 不需要图片灯箱时请留空
lightbox:

# --------------------------------------
# 标签插件设置
# --------------------------------------

# 文章系列
series:
  enable: true
  # 按标题或日期排序
  orderBy: 'title'
  # 排序方向：1 或 asc 表示升序；-1 或 desc 表示降序
  order: -1
  number: true

# ABCJS：ABC 音乐记谱插件
# https://github.com/paulrosen/abcjs
abcjs:
  enable: false
  per_page: true

# Mermaid 图表
# https://github.com/mermaid-js/mermaid
mermaid:
  enable: false
  # 使用代码块编写 Mermaid 图表
  code_write: false
  # 内置主题：default / forest / dark / neutral
  theme:
    light: default
    dark: dark
  # 启用“在新标签页中打开”按钮，在独立窗口中查看图表
  open_in_new_tab: true
  # 启用图表缩放和平移交互
  zoom_pan: true

# Chart.js 图表
# 参见 https://www.chartjs.org/docs/latest/
chartjs:
  enable: false
  # 除非了解其工作方式，否则不要修改
  # 仅当 Markdown 语法未指定相关设置时，才会使用以下默认值
  # 图表的通用字体颜色
  fontColor:
    light: 'rgba(0, 0, 0, 0.8)'
    dark: 'rgba(255, 255, 255, 0.8)'
  # 图表的通用边框颜色
  borderColor:
    light: 'rgba(0, 0, 0, 0.1)'
    dark: 'rgba(255, 255, 255, 0.2)'
  # 雷达图和极坐标区域图刻度标签的背景颜色
  scale_ticks_backdropColor:
    light: 'transparent'
    dark: 'transparent'

# Note：Bootstrap 提示框
note:
  # Note 标签样式值：
  #  - simple    bs-callout 旧版提示样式，默认值
  #  - modern    bs-callout 新版（v2-v3）提示样式
  #  - flat      带背景的扁平提示样式，类似 Mozilla 或 StackOverflow
  #  - disabled  禁用 Note 标签的所有 CSS 样式导入
  style: flat
  icons: true
  border_radius: 3
  # modern 和 flat 样式的背景明暗偏移百分比（modern：-12 | 12；flat：-18 | 6）
  # 该偏移也会应用到 label 标签变量；禁用 Note 标签时此选项仍可生效
  light_bg_offset: 0

# --------------------------------------
# 其他设置
# --------------------------------------

# https://github.com/MoOx/pjax
pjax:
  enable: false
  # 从 PJAX 中排除指定页面，例如 '/music/'
  exclude:
    # - /xxxxxx/

# Snackbar：浮动通知
# https://github.com/polonel/SnackBar
# 位置：top-left / top-center / top-right / bottom-left / bottom-center / bottom-right
snackbar:
  enable: false
  position: bottom-left
  # 浅色模式和深色模式下浮动通知的背景颜色
  bg_light: '#49b1f5'
  bg_dark: '#1f1f1f'

# Instant.page 页面预加载
# https://instant.page/
instantpage: false

# 图片懒加载
# https://github.com/verlok/vanilla-lazyload
lazyload:
  enable: false
  # 使用浏览器原生懒加载代替 vanilla-lazyload
  native: true
  # 指定懒加载范围（site 或 post）
  field: site
  placeholder:
  blur: false

# PWA 渐进式 Web 应用
# 参见 https://github.com/JLHwung/hexo-offline
# ---------------
pwa:
  enable: false
  manifest:
  apple_touch_icon:
  favicon_32_32:
  favicon_16_16:
  mask_icon:

# Open Graph 元标签
# https://hexo.io/docs/helpers#open-graph
Open_Graph_meta:
  enable: true
  option:
    # twitter_card:
    # twitter_image:
    # twitter_id:
    # twitter_site:
    # google_plus:
    # fb_admins:
    # fb_app_id:

# 结构化数据
# https://developers.google.com/search/docs/guides/intro-structured-data
structured_data:
  enable: true
  # 站点的备选名称，用于结构化数据
  # 格式：['name1', 'name2']
  alternate_name: ['Jayson Blog', 'Jayson-Blog']

# 添加浏览器厂商前缀以确保兼容性
css_prefix: true

# 代码注入
# 将代码插入 head（'</head>' 标签之前）和页面底部（'</body>' 标签之前）
inject:
  head:
    # - <link rel="stylesheet" href="/xxx.css">
  bottom:
    # - <script src="xxxx"></script>

# CDN 设置
# 除非了解其工作方式，否则不要修改以下设置
CDN:
  # 内部脚本和第三方脚本使用的 CDN 提供商
  # 两者均可选择：local/jsdelivr/unpkg/cdnjs/custom
  # 注意：开发版本的内部脚本只能使用 'local'
  # 注意：第三方脚本设为 'local' 时，需要安装 hexo-butterfly-extjs
  internal_provider: local
  third_party_provider: jsdelivr

  # 是否在 URL 中添加版本号，可选 true 或 false
  version: true

  # 自定义格式
  # 示例：https://cdn.staticfile.org/${cdnjs_name}/${version}/${min_cdnjs_file}
  custom_format:

  option:
    # abcjs_basic_js:
    # activate_power_mode:
    # algolia_js:
    # algolia_search:
    # artalk_css:
    # artalk_js:
    # blueimp_md5:
